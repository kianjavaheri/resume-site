<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Kian Javaheri — Software Developer" />
    <title>Kian Javaheri</title>
    <script>
      // Paint the correct background before React mounts, so switching to the
      // system theme doesn't flash white on a dark-mode device.
      (function () {
        try {
          var pref = JSON.parse(localStorage.getItem('theme-pref') || '"system"');
        } catch (e) { var pref = 'system'; }
        var dark = pref === 'dark' || (pref !== 'light' &&
          window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        document.documentElement.style.background = dark ? '#0a0a0a' : '#ffffff';
        // Also on <html>, so the theme tokens in App.css resolve at the ROOT.
        // The page scrollbar is painted by the root element, and a var it
        // looks up has to be defined there — not on the .home/.paper div.
        // useTheme keeps this in step once React is running.
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
